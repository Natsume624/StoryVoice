name: Build StoryVoice Android

on:
  push:
    branches: [main, codex/offline-reader]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish v0.3.1 playback hotfix
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13599879"

      - name: Create local Firebase placeholder
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "storyvoice-local",
              "storage_bucket": "storyvoice-local.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.storyvoice.app" }
              },
              "api_key": [{ "current_key": "AIzaSyStoryVoiceLocalPlaceholder000000000" }]
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/StoryVoice-v0.3.1.apk
          sha256sum release-artifacts/StoryVoice-v0.3.1.apk > release-artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryVoice-v0.3.1
          path: release-artifacts/*

      - name: Publish GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          name: StoryVoice v0.3.1 - 离线朗读修复
          body: |
            修复离线“台湾故事姐姐”模型下载完成后，点击朗读按钮长时间转圈的问题。

            - ZipVoice 改为边生成边播放，首段音频生成后立即开始朗读
            - 修复模型初始化失败时播放器一直处于加载状态的问题
            - 已下载的 v0.3.0 离线模型可以继续使用，无需重新下载

            安装 `StoryVoice-v0.3.1.apk` 即可覆盖升级。
          files: |
            release-artifacts/StoryVoice-v0.3.1.apk
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
