name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish v0.2.1 to GitHub Releases"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StoryVoice-v0.2.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryVoice-v0.2.1
          path: StoryVoice-v0.2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.2.1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.1 || gh release create v0.2.1 --title "StoryVoice v0.2.1" --prerelease --notes "修复书架与阅读页面卡顿：书架和大文件写入改为后台处理，阅读进度不再反复写入整本正文；加入全新的拾声品牌图标。"
          gh release upload v0.2.1 StoryVoice-v0.2.1.apk --clobber
